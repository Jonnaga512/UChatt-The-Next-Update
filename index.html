<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UChatt</title>
<style>
:root{--hd:#008069;--bg:#efeae2;--panel:#fff;--text:#111b21;--muted:#667781;--line:#e9edef;--mine:#d9fdd3;--other:#fff;--acc:#00a884;--chip:#f0f2f5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--hd:#202c33;--bg:#0b141a;--panel:#111b21;--text:#e9edef;--muted:#8696a0;--line:#222d34;--mine:#005c4b;--other:#202c33;--acc:#00a884;--chip:#202c33;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--panel);color:var(--text);font-size:15px;line-height:1.4}
.hide{display:none!important}
#app{height:100%;max-width:640px;margin:0 auto;background:var(--panel);position:relative;overflow:hidden}
.err{color:#e5484d;font-size:13px;min-height:16px}
#auth{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.logo{width:80px;height:80px;border-radius:24px;background:var(--acc);display:grid;place-items:center;font-size:40px;margin-bottom:14px}
#auth h1{margin:0 0 6px;font-size:28px}#auth p{color:var(--muted);max-width:300px;margin:0 0 20px}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
input[type=text],input:not([type]){padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-size:16px;outline:none}
.btn{border:0;border-radius:12px;padding:13px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn.s{padding:8px 14px;font-size:14px;border-radius:999px}
#main{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;background:var(--hd);color:#fff;min-height:58px}
header b{font-size:19px;flex:1}
.ib{border:0;background:none;color:inherit;font-size:22px;cursor:pointer;padding:6px 8px;border-radius:50%;line-height:1}
#body{flex:1;min-height:0;position:relative}
.v{position:absolute;inset:0;overflow-y:auto}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 7px;font:inherit;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:21px}
nav button.on{color:var(--acc);font-weight:700}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 auto;overflow:hidden;text-transform:uppercase}
.av img{width:100%;height:100%;object-fit:cover}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.li .t{flex:1;min-width:0}.li .t b{display:block}.li .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{padding:14px 16px 6px;font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf);flex:0 0 auto;display:grid}
.ring .av{border:2px solid var(--panel)}
.pad{padding:16px}
.fs{display:flex;gap:8px;padding:12px 16px}.fs input{flex:1;min-width:0}
#vconv{display:flex;flex-direction:column;background-color:var(--bg);background-image:radial-gradient(rgba(128,128,128,.12) 1px,transparent 1px);background-size:18px 18px}
#msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;font-size:11px;background:var(--chip);color:var(--muted);padding:3px 10px;border-radius:8px;margin:6px 0}
.r{display:flex;align-items:flex-end;gap:6px;max-width:84%}
.r.me{align-self:flex-end;flex-direction:row-reverse}
.r.gap{margin-top:8px}.r .sp{width:28px;flex:0 0 auto}
.bub{padding:6px 9px 5px;border-radius:10px;background:var(--other);box-shadow:0 1px 1px rgba(0,0,0,.13);overflow-wrap:anywhere;min-width:60px}
.r.me .bub{background:var(--mine)}
.nm{font-size:12.5px;font-weight:700;margin-bottom:1px}
.tm{font-size:10.5px;color:var(--muted);float:right;margin:5px 0 0 10px}
.mi{display:block;max-width:100%;width:250px;border-radius:8px;margin-bottom:3px;cursor:pointer}
.au{width:220px;max-width:100%;height:40px}
.loc{display:block;padding:10px;border-radius:8px;background:var(--chip);color:var(--acc);font-weight:600;text-decoration:none;margin-bottom:3px}
#rec{text-align:center;padding:6px;font-size:13px;background:#e5484d;color:#fff}
form{display:flex;gap:6px;align-items:center;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--chip)}
form input[type=text]{flex:1;min-width:0;border-radius:999px;background:var(--panel);border:0;padding:12px 16px}
form .ib{color:var(--muted);font-size:23px}
.ib.red{color:#e5484d}
.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--acc);color:#fff;font-size:18px;cursor:pointer;flex:0 0 auto}
#sv{position:absolute;inset:0;background:#000;z-index:20;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
#sv img,#sv video{max-width:100%;max-height:100%}
#sv .tx{font-size:26px;font-weight:700;text-align:center;padding:30px;width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#6a5cff,#d62976)}
#sv .meta{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;display:flex;gap:8px;align-items:center;text-shadow:0 1px 3px #000}
#boot{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--panel);color:var(--muted);padding:24px;text-align:center}
#toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1}

/* ===== UChatt sky-blue refresh ===== */
:root{
 --hd:#ffffff;--bg:#f3f9fd;--panel:#ffffff;--text:#20384b;--muted:#8293a0;
 --line:#e7eff5;--mine:#dff2ff;--other:#ffffff;--acc:#55b5e6;--chip:#f2f8fc;
 color-scheme:light
}
body{background:#f4f9fd;color:var(--text);font-size:15px}
#app{max-width:520px;box-shadow:0 0 36px rgba(49,117,157,.08);border-left:1px solid #edf3f7;border-right:1px solid #edf3f7}
header{background:rgba(255,255,255,.96);color:#20384b;border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(37,91,125,.04)}
header b{font-size:19px;letter-spacing:-.3px}
.ib{color:#579fc7}
.btn,.send{background:linear-gradient(135deg,#65c2ec,#4ca9dc);box-shadow:0 5px 14px rgba(77,174,222,.16)}
.btn{border-radius:14px}
.btn.s{box-shadow:none}
input[type=text],input:not([type]){background:#f6fafd;border:1px solid #e4eef5;border-radius:14px}
nav{background:rgba(255,255,255,.97);border-top:1px solid #e8f0f5;box-shadow:0 -5px 18px rgba(33,88,120,.035)}
nav button{font-size:11px;padding:10px 0 8px}
nav button span{font-size:22px}
nav button.on{color:#329acb}
.li{padding:13px 16px;border-bottom:1px solid #f0f4f7}
.sec{color:#399bc9;letter-spacing:.7px}
.av{background:linear-gradient(135deg,#b7e8fb,#55b6e5)!important;color:#155b82}
#vconv{background-color:#f2f8fc;background-image:radial-gradient(rgba(90,163,201,.10) 1px,transparent 1px)}
.bub{border:1px solid #e7eff5;border-radius:14px;box-shadow:0 2px 7px rgba(45,100,133,.05)}
.r.me .bub{background:#e1f3ff;border-color:#d3ebfa}
#msgs{padding:14px 12px}
form{background:#fff;border-top:1px solid #e9f1f6}
form input[type=text]{background:#f4f9fc;border:1px solid #edf3f7}
.send{border-radius:15px}
#auth .logo{background:linear-gradient(135deg,#a8e2fa,#4aaee0);box-shadow:0 10px 25px rgba(74,174,224,.2)}
#toast{background:#24465c;box-shadow:0 6px 20px rgba(24,55,75,.18)}
/* Instagram-like profile: compact sizing tuned for phone screens */
.profile-wrap{padding:16px 16px 12px}
.profile-topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.profile-handle{font-size:18px;font-weight:800;letter-spacing:-.35px}
.profile-more{width:38px;height:38px;border:0;border-radius:13px;background:#eff8fd;color:#4b9fc9;font-size:21px}
.profile-stats{display:grid;grid-template-columns:88px repeat(3,minmax(0,1fr));align-items:center;gap:5px;margin:8px 0 18px}
.profile-avatar-wrap{position:relative;width:88px;height:88px;border-radius:50%;padding:3px;border:2px solid #a9ddf4}
.profile-avatar-wrap .av{width:100%!important;height:100%!important;font-size:30px!important;border:2px solid white}
.profile-edit-avatar{position:absolute;right:-2px;bottom:-1px;width:27px;height:27px;border:2px solid white;border-radius:50%;background:#55b5e6;color:white;display:grid;place-items:center;font-size:12px}
.stat{text-align:center;min-width:0}
.stat strong{display:block;font-size:19px;line-height:1.2;font-weight:800;color:#20384b}
.stat span{display:block;font-size:11px;line-height:1.3;color:#8293a0;white-space:nowrap}
.profile-name{font-size:17px;font-weight:800;margin:0 0 3px}
.profile-bio{font-size:14px;color:#647b8a;margin:0 0 15px;white-space:pre-wrap}
.profile-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 42px;gap:7px;margin-bottom:20px}
.profile-action{height:42px;border:0;border-radius:12px;background:#eef7fd;color:#31566d;font-weight:750;font-size:12px}
.profile-action.icon{font-size:17px}
.profile-section-title{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;margin:0 0 10px}
.profile-section-title button{border:0;background:none;color:#399bc9;font-weight:750;font-size:12px}
.profile-search{padding:11px 13px;border:1px solid #e3edf4;border-radius:14px;background:#f6fafd;color:#8798a4;font-size:12px;margin-bottom:17px;cursor:pointer}
.profile-tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e8eff4;border-bottom:1px solid #e8eff4}
.profile-tab{height:44px;border:0;background:white;color:#8293a0;font-weight:750;font-size:12px}
.profile-tab.active{color:#399bc9;border-bottom:2px solid #55b5e6}
.profile-empty{text-align:center;padding:32px 12px 28px;color:#8293a0}
.profile-empty-icon{width:60px;height:60px;border:2px solid #a8d9f0;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#399bc9;font-size:22px}
.profile-empty strong{display:block;color:#31566d;font-size:16px;margin-bottom:6px}
.profile-empty p{font-size:12px;margin:0 0 14px}
@media(max-width:360px){.profile-stats{grid-template-columns:76px repeat(3,minmax(0,1fr));gap:3px}.profile-avatar-wrap{width:76px;height:76px}.stat span{font-size:10px}.profile-wrap{padding-left:12px;padding-right:12px}}
.reply-bar{display:flex;align-items:center;gap:10px;padding:9px 13px;background:#fff;border-top:1px solid #e8f0f5}
.reply-bar .reply-content{flex:1;min-width:0;border-left:3px solid #55b5e6;padding-left:9px}
.reply-bar b{display:block;color:#399bc9;font-size:12px}
.reply-bar small{display:block;color:#8293a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-cancel{border:0;background:#eff7fc;color:#628398;border-radius:50%;width:30px;height:30px;font-size:18px}
.reply-quote{border-left:3px solid #55b5e6;background:rgba(85,181,230,.10);padding:6px 8px;border-radius:7px;margin-bottom:5px}
.reply-quote b{display:block;font-size:11px;color:#399bc9}
.reply-quote span{font-size:12px;color:#617b8d}
.r{touch-action:pan-y}
@media(min-width:700px){#app{max-width:560px}.profile-wrap{padding-left:26px;padding-right:26px}}


.profile-modal-backdrop{position:absolute;inset:0;z-index:35;background:rgba(24,54,73,.38);display:flex;align-items:center;justify-content:center;padding:20px}
.profile-modal{width:100%;max-width:390px;background:#fff;border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(28,74,103,.22)}
.profile-modal h3{margin:0 0 16px;color:#20384b;font-size:20px}
.profile-modal label{display:block;color:#647b8a;font-size:12px;font-weight:700;margin:12px 0 6px}
.profile-modal input{width:100%;padding:12px 13px;border:1px solid #e3edf4;border-radius:12px;background:#f7fbfe;color:#20384b;font:inherit}
.profile-modal textarea{width:100%;min-height:78px;resize:vertical;padding:12px 13px;border:1px solid #e3edf4;border-radius:12px;background:#f7fbfe;color:#20384b;font:inherit}
.profile-modal-actions{display:flex;gap:9px;margin-top:18px}
.profile-modal-actions button{flex:1}
.auth-switch{border:0;background:transparent;color:#399bc9;font:inherit;font-weight:700;padding:8px;cursor:pointer}
.auth-note{display:block;color:#8293a0;font-size:11px;line-height:1.45;margin-top:2px}
.profile-modal .hint{display:block;color:#8293a0;font-size:11px;line-height:1.4;margin-top:5px}
.profile-modal input[type=password]{width:100%;padding:12px 13px;border:1px solid #e3edf4;border-radius:12px;background:#f7fbfe;color:#20384b;font:inherit}


/* ===== Auth form polish: equal-width, rounded fields ===== */
#auth{min-height:100%;height:100%;overflow-y:auto;justify-content:center;padding:clamp(22px,5vh,48px) 22px calc(22px + env(safe-area-inset-bottom,0px));}
#auth .logo{width:76px;height:76px;border-radius:23px;font-size:38px;margin-bottom:12px;flex:0 0 auto}
#auth h1{font-size:30px;letter-spacing:-.7px;margin-bottom:5px}
#auth p{font-size:14px;line-height:1.5;max-width:310px;margin-bottom:22px}
#auth .card{width:100%;max-width:390px;gap:11px;align-items:stretch}
#auth #register-fields,#auth #confirm-wrap{display:block;width:100%;margin:0}
#auth #register-fields.hide,#auth #confirm-wrap.hide{display:none}
#auth .card input[type="text"],#auth .card input[type="password"],#auth .card input:not([type]){
 display:block;width:100%;min-width:0;height:54px;padding:0 17px;margin:0;border:1px solid #e2edf5;border-radius:17px;
 background:#f4f9fd;color:#20384b;font:inherit;font-size:15px;line-height:normal;box-shadow:inset 0 1px 1px rgba(28,83,115,.025);outline:none;
 -webkit-appearance:none;appearance:none;
}
#auth .card input::placeholder{color:#91a0aa;opacity:1}
#auth .card input:focus{border-color:#75c5e9;box-shadow:0 0 0 3px rgba(85,181,230,.13);background:#fff}
#auth #go{width:100%;height:54px;border-radius:17px;margin-top:3px;font-size:15px}
#auth .auth-switch{font-size:14px;padding:9px 6px}
#auth .err{width:100%;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
#auth .auth-note{max-width:340px;margin:0 auto;font-size:11px;line-height:1.5}
/* Swipe-to-reply follows the finger, then springs back */
.r{position:relative;will-change:transform;transition:transform .24s cubic-bezier(.2,.8,.2,1);}
.r.swiping{transition:none;}
.r .swipe-reply-hint{position:absolute;left:-31px;bottom:7px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#e4f4fd;color:#319acb;font-size:15px;opacity:0;transform:scale(.72);transition:opacity .08s linear,transform .08s linear;pointer-events:none;}
.r.me .swipe-reply-hint{left:auto;right:-31px;}
@media(max-height:650px){#auth{justify-content:flex-start;padding-top:18px}#auth .logo{width:62px;height:62px;font-size:31px;margin-bottom:8px}#auth p{margin-bottom:14px}}


/* Jump-to-latest control inspired by chat apps */
#jumpLatest{
  position:absolute;right:14px;bottom:78px;z-index:12;
  width:46px;height:46px;border:0;border-radius:50%;
  background:#344653;color:#f7fbff;
  box-shadow:0 5px 18px rgba(22,45,60,.24);
  display:grid;place-items:center;cursor:pointer;
  opacity:0;transform:translateY(10px) scale(.9);
  pointer-events:none;transition:opacity .2s,transform .2s;
}
#jumpLatest.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
#jumpLatest svg{width:25px;height:25px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
#messageActions{
  position:absolute;inset:0;z-index:35;background:rgba(16,35,49,.22);
  display:flex;align-items:flex-end;justify-content:center;padding:14px;
}
#messageActions.hide{display:none!important}
#messageActions .action-sheet{
  width:min(100%,420px);background:#fff;border:1px solid #e7eff5;
  border-radius:20px;padding:9px;box-shadow:0 14px 38px rgba(20,54,75,.2);
  animation:sheetIn .18s ease-out;
}
#messageActions .action-title{padding:9px 12px 12px;color:#8293a0;font-size:12px}
#messageActions button{
  width:100%;border:0;background:transparent;text-align:left;padding:14px 13px;
  border-radius:12px;color:#29465a;font:inherit;font-size:14px;font-weight:650;
}
#messageActions button:active{background:#eef7fc}
#messageActions button.danger{color:#d94c58}
#messageActions button.cancel{background:#f2f8fc;text-align:center;margin-top:5px}
@keyframes sheetIn{from{transform:translateY(18px);opacity:.5}to{transform:translateY(0);opacity:1}}
.r{transition:transform .18s ease}
.r.swiping{transition:none}


/* ===== UChatt navigation polish ===== */
#nav{gap:2px;padding-top:5px}
#nav button{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-height:58px;padding:5px 0 7px;border-radius:15px;
  color:#93a3ad;background:transparent;transition:color .22s ease,background .22s ease,transform .18s ease;
  -webkit-tap-highlight-color:transparent
}
#nav button span{
  width:34px;height:31px;display:grid;place-items:center;border-radius:12px;
  font-size:0;transition:background .22s ease,transform .22s ease,color .22s ease
}
#nav button span svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s ease}
#nav button.on{color:#319dce;font-weight:750}
#nav button.on span{background:#e5f5fd;transform:translateY(-2px)}
#nav button.on span svg{stroke-width:2.35;transform:scale(1.06)}
#nav button:active{transform:scale(.94)}
#nav button:focus-visible{outline:2px solid #78c7ec;outline-offset:2px}
#nav button.on:after{
 content:"";position:absolute;bottom:1px;width:17px;height:3px;border-radius:4px;background:#55b5e6;
 animation:navMark .22s ease-out
}
@keyframes navMark{from{width:4px;opacity:.3}to{width:17px;opacity:1}}
/* ===== Friends / Discover ===== */
.friends-page{padding:18px 16px 24px}
.discover-hero{
 position:relative;overflow:hidden;padding:22px 20px 20px;border-radius:26px;
 background:linear-gradient(135deg,#eefaff 0%,#e5f5fd 58%,#d9f0fc 100%);
 border:1px solid #dceef7;box-shadow:0 8px 24px rgba(54,142,185,.07);margin:10px 0 22px
}
.discover-hero:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-55px;top:-80px;background:rgba(117,201,238,.16)}
.discover-kicker{position:relative;color:#4b9fc6;font-size:11px;font-weight:850;letter-spacing:2px;margin-bottom:12px}
.discover-hero h2{position:relative;margin:0 0 8px;font-size:21px;line-height:1.25;color:#24465c;letter-spacing:-.45px}
.discover-hero p{position:relative;margin:0 0 17px;color:#8196a3;font-size:14px;line-height:1.45}
.discover-search{position:relative;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dfebf1;border-radius:19px;padding:0 14px;box-shadow:0 3px 10px rgba(45,101,131,.045)}
.discover-search svg{width:20px;height:20px;stroke:#72a9c5;fill:none;stroke-width:2}
.discover-search input{flex:1;min-width:0;border:0!important;outline:0;background:transparent!important;border-radius:18px!important;padding:15px 0!important;color:#29485c;font-size:15px}
.discover-foot{position:relative;margin-top:14px;color:#8297a4;font-size:12px}
.friends-section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 11px;color:#29475b;font-size:16px;font-weight:800}
.friends-count{font-size:12px;color:#8da0ab;font-weight:600}
.friend-card{
 display:flex;align-items:center;gap:12px;padding:12px 13px;margin:0 0 9px;
 border:1px solid #e8f0f5;border-radius:18px;background:#fff;
 box-shadow:0 3px 12px rgba(33,88,120,.035);transition:transform .16s,border-color .16s
}
.friend-card:active{transform:scale(.985);border-color:#b9e2f5}
.friend-card .friend-info{flex:1;min-width:0}
.friend-card .friend-info b{display:block;font-size:14px;color:#29475b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-card .friend-info small{display:block;margin-top:3px;color:#91a1aa;font-size:12px}

<script>
// ===== Supabase (jangan diganti) =====
var SUPABASE_URL = "https://aqurgyiimjgyqxoqnhto.supabase.co";
var SUPABASE_KEY = "sb_publishable_XLGOqtX1F7ZoD6AYEebvXg_8KGLegIO";
// =====================================

function showErr(m){var b=document.getElementById("boot");b.classList.remove("hide");b.textContent="";var t=document.createElement("div");t.textContent=m;var x=document.createElement("button");x.className="btn s";x.textContent="Muat ulang";x.onclick=function(){location.reload()};b.appendChild(t);b.appendChild(x)}
window.addEventListener("error",function(e){showErr("Terjadi error: "+e.message)});

function startApp(){
var ROOMS=[["Umum","🏫"]];
var COLORS=["#6a5cff","#ff6b8b","#18b57e","#f59e0b","#0ea5e9","#a855f7","#ef4444","#14b8a6"];
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var me=null,prof=null,P={},F=[],cur=null,msgs=[],tab="chats",mr=null,chunks=[],TT=null,ST=null,replyTo=null;
var actionMessage=null,forceBottom=true,hiddenMessageIds=new Set(),statusGroups=[];
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function color(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COLORS[h%COLORS.length]}
function av(p,sz){sz=sz||44;var d=el("div","av");d.style.width=d.style.height=sz+"px";d.style.fontSize=(sz*.42)+"px";var n=(p&&(p.display_name||p.username||p.name))||"?";
  if(p&&p.avatar_url){var i=document.createElement("img");i.src=p.avatar_url;d.appendChild(i)}else{d.style.background=color(n);d.textContent=n.charAt(0)}return d}
function toast(t){var x=$("toast");x.textContent=t;x.classList.add("on");clearTimeout(TT);TT=setTimeout(function(){x.classList.remove("on")},3200)}
function hm(ts){return new Date(ts).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
function dl(ts){var d=new Date(ts);return d.toDateString()===new Date().toDateString()?"Hari ini":d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}
function pn(id){var p=P[id];return p?(p.display_name||p.username):"Pengguna"}
function dm(o){return "dm:"+[me.id,o].sort().join("_")}
function li(a,t,s,fn){var r=el("div","li");r.appendChild(a);var x=el("div","t");x.appendChild(el("b","",t));if(s)x.appendChild(el("small","",s));r.appendChild(x);if(fn)r.onclick=fn;return r}

/* ---------- AUTH: USERNAME + PASSWORD ---------- */
var authMode="login";
// Supabase Auth mewajibkan identitas berformat email. Pengguna TIDAK diminta
// memasukkan email; alamat placeholder unik ini dibuat otomatis dan tidak untuk menerima email.
function syntheticEmail(){return "u"+crypto.randomUUID().replace(/-/g,"")+"@example.com"}
function setAuthMode(mode){
  authMode=mode;var reg=mode==="register";
  $("register-fields").classList.toggle("hide",!reg);
  $("confirm-wrap").classList.toggle("hide",!reg);
  $("go").textContent=reg?"Daftar akun":"Masuk";
  $("auth-switch").textContent=reg?"Sudah punya akun? Masuk":"Belum punya akun? Daftar";
  $("auth-subtitle").textContent=reg?"Buat akun UChatt sekali saja, lalu gunakan kembali kapan pun.":"Masuk dengan username dan password akun UChatt-mu.";
  $("pw").autocomplete=reg?"new-password":"current-password";
  $("aerr").textContent="";
}
$("auth-switch").onclick=function(){setAuthMode(authMode==="login"?"register":"login")};
$("go").onclick=async function(){
  var u=$("un").value.trim().replace(/^@+/,"").toLowerCase(),password=$("pw").value,er=$("aerr");er.textContent="";
  if(!/^[a-z0-9_]{3,20}$/.test(u)){er.textContent="Username 3–20 karakter: huruf kecil, angka, atau _.";return}
  if(password.length<8){er.textContent="Password minimal 8 karakter.";return}
  $("go").disabled=true;$("go").textContent=authMode==="register"?"Membuat akun…":"Memeriksa akun…";
  try{
    if(authMode==="register"){
      var display=$("dn").value.trim()||u;
      if($("pw2").value!==password){er.textContent="Konfirmasi password belum sama.";return}
      var exists=await sb.from("profiles").select("id").eq("username",u).maybeSingle();
      if(exists.data){er.textContent="Username sudah digunakan. Pilih username lain.";return}
      if(exists.error){er.textContent="Tidak bisa memeriksa username: "+exists.error.message;return}
      // Email internal acak dipakai sebagai identitas Supabase Auth; pengguna cukup mengingat username.
      var email=syntheticEmail();
      var a=await sb.auth.signUp({email:email,password:password,options:{data:{username:u,display_name:display}}});
      if(a.error){er.textContent=a.error.message;return}
      if(!a.data.session||!a.data.user){er.textContent="Akun dibuat, tetapi Supabase meminta verifikasi email. Untuk mode username/password tanpa email, matikan Confirm email di Authentication → Providers → Email, lalu daftar ulang dengan username yang belum terpakai.";return}
      me=a.data.user;
      var pr=await sb.from("profiles").upsert({id:me.id,username:u,display_name:display},{onConflict:"id"}).select().single();
      if(pr.error){er.textContent="Akun Auth sudah dibuat, tetapi profil gagal disimpan: "+pr.error.message+". Jangan daftar ulang; coba masuk lagi setelah memperbaiki tabel profiles.";return}
      prof=pr.data;prof.bio=(me.user_metadata&&me.user_metadata.bio)||"";await enter();
    }else{
      var lookup=await sb.rpc("uchatt_login_email",{p_username:u});
      if(lookup.error){er.textContent="Fungsi login username belum dipasang. Jalankan SQL tambahan UChatt terlebih dahulu.";return}
      var email=lookup.data;
      if(!email){er.textContent="Username belum terdaftar. Silakan daftar akun terlebih dahulu.";return}
      var a=await sb.auth.signInWithPassword({email:email,password:password});
      if(a.error){er.textContent="Username atau password salah.";return}
      me=a.data.user;
      var pr=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
      if(pr.error||!pr.data){er.textContent="Profil akun tidak ditemukan. Hubungi admin UChatt.";return}
      prof=pr.data;prof.bio=(me.user_metadata&&me.user_metadata.bio)||prof.bio||"";await enter();
    }
  }catch(e){er.textContent="Terjadi kesalahan: "+e.message}
  finally{$("go").disabled=false;$ ("go").textContent=authMode==="register"?"Daftar akun":"Masuk"}
};
(async function(){
  try{var s=await sb.auth.getSession();
    if(s.data.session&&!s.data.session.user.is_anonymous){me=s.data.session.user;var r=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();if(r.data){prof=r.data;prof.bio=(me.user_metadata&&me.user_metadata.bio)||prof.bio||"";await enter();return}}
    if(s.data.session&&s.data.session.user.is_anonymous){await sb.auth.signOut()}
  }catch(e){showErr("Gagal memuat: "+e.message);return}
  $("boot").classList.add("hide");$("auth").classList.remove("hide");setAuthMode("login");
})();

async function loadP(){var r=await sb.from("profiles").select("*");P={};(r.data||[]).forEach(function(p){P[p.id]=p})}
async function loadF(){var r=await sb.from("friends").select("*");F=r.data||[]}
function friends(){return F.filter(function(f){return f.status==="accepted"}).map(function(f){return f.a===me.id?f.b:f.a})}

}

$("avatarZoom").onclick=function(e){if(e.target===$("avatarZoom"))$("avatarZoom").classList.remove("open")};

  if(!uid||uid===me.id){go("me");return}
  var p=P[uid];
  if(!p){toast("Profil pengguna belum tersedia");return}
  var root=$("publicProfile");root.innerHTML="";
  var head=el("div","public-head"),back=el("button","public-back","‹");back.onclick=closePublicProfile;
  head.appendChild(back);head.appendChild(el("b","","Profil"));root.appendChild(head);

  top.appendChild(avatar);
  var stats=el("div","public-stats");
  [["0","postingan"],["0","teman"]].forEach(function(x){var s=el("div");s.appendChild(el("strong","",x[0]));s.appendChild(el("span","",x[1]));stats.appendChild(s)});

  var friend=el("button","","");var relation=F.find(function(f){return (f.a===me.id&&f.b===uid)||(f.a===uid&&f.b===me.id)});
  if(relation&&relation.status==="accepted"){friend.textContent="✓ Berteman";friend.disabled=true}

async function enter(){
  $("boot").classList.add("hide");$("auth").classList.add("hide");$("main").classList.remove("hide");
  await Promise.all([loadP(),loadF()]);P[me.id]=prof;
  sb.channel("rt").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},function(p){
    var m=p.new;if(m.room===cur&&!hiddenMessageIds.has(String(m.id))&&!msgs.some(function(x){return x.id===m.id})){
      var box=$("msgs"),near=box.scrollHeight-box.scrollTop-box.clientHeight<110;
      msgs.push(m);forceBottom=near;drawMsgs();
    }
  }).on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},function(p){
    var gone=p.old;if(cur&&gone&&msgs.some(function(x){return String(x.id)===String(gone.id)})){
      msgs=msgs.filter(function(x){return String(x.id)!==String(gone.id)});drawMsgs();

    if(paused||replyOpen)return;
    var fill=sv.querySelector(".story-segment.active i");
    if(fill&&video.duration&&isFinite(video.duration)){fill.style.width=(Math.min(1,video.currentTime/video.duration)*100)+"%";remaining=Math.max(0,(video.duration-video.currentTime)*1000)}
    if(!video.ended)progressFrame=requestAnimationFrame(function(){progressVideo(video)});
  }
  function next(){index++;if(index>=currentGroup().list.length){groupIndex++;index=0}render()}
  function previous(){if(index>0)index--;else if(groupIndex>0){groupIndex--;index=groups[groupIndex].list.length-1}render()}
  function skipUser(){groupIndex++;index=0;if(!currentGroup())cleanup();else render()}
  // Press and hold pauses playback, like WhatsApp.
  function holdStart(e){if(e.target.closest(".story-reply-panel,.story-close,.story-zone"))return;pause()}
  function holdEnd(){if(!replyOpen)resume()}
  sv.addEventListener("pointerdown",holdStart);
  sv.addEventListener("pointerup",holdEnd);
  sv.addEventListener("pointercancel",holdEnd);
  var touchX=0,touchY=0;
  sv.addEventListener("touchstart",function(e){if(e.touches.length!==1)return;touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});
  sv.addEventListener("touchend",function(e){
    if(!touchX)return;var dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;
    if(Math.abs(dy)>55&&dy<0)openReply();
    else if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){if(dx<0)next();else skipUser()}
    touchX=0;touchY=0;
  },{passive:true});
  sv.onclick=function(e){if(e.target.closest(".story-top,.story-reply-panel"))return};
  document.addEventListener("visibilitychange",visibilityPause);
  render();
}

/* ---------- TEMAN ---------- */
function drawFriends(){
  var v=$("vfriends");v.innerHTML="";
  var page=el("div","friends-page");
  var hero=el("div","discover-hero");
  hero.appendChild(el("div","discover-kicker","UCHATT DISCOVER"));
  hero.appendChild(el("h2","","Siapa yang ingin kamu temukan?"));
  hero.appendChild(el("p","","Cari teman melalui nama lengkap atau username mereka."));
  var search=el("div","discover-search");
  search.innerHTML='<svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>';
  var q=document.createElement("input");q.id="fq";q.placeholder="Contoh: nama atau @username…";q.autocapitalize="none";q.autocomplete="off";
  search.appendChild(q);hero.appendChild(search);hero.appendChild(el("div","discover-foot","✦  Temukan teman, lalu mulai ngobrol."));
  page.appendChild(hero);
  var l=el("div");l.id="flist";page.appendChild(l);v.appendChild(page);
  q.addEventListener("keydown",function(e){if(e.key==="Enter")addF()});
  var debounce=null;q.addEventListener("input",function(){clearTimeout(debounce);debounce=setTimeout(drawFList,180)});
  drawFList();
}
function drawFList(){
  var l=$("flist");if(!l)return;l.innerHTML="";
  var inc=F.filter(function(f){return f.status==="pending"&&f.b===me.id});
  if(inc.length){
    l.appendChild(el("div","friends-section-title","Permintaan pertemanan"));
    inc.forEach(function(f){
      var r=el("div","friend-card");r.appendChild(av(P[f.a],46));
      var info=el("div","friend-info");info.appendChild(el("b","",pn(f.a)));info.appendChild(el("small","","@"+((P[f.a]||{}).username||"")));
      r.appendChild(info);
      var ok=el("button","friend-chat","Terima");ok.onclick=async function(){var x=await sb.from("friends").update({status:"accepted"}).eq("id",f.id);if(x.error){toast(x.error.message);return}await loadF();drawFList()};
      var no=el("button","friend-chat","Tolak");no.style.color="#d66b78";no.style.background="#fff0f1";no.onclick=async function(){var x=await sb.from("friends").delete().eq("id",f.id);if(x.error){toast(x.error.message);return}await loadF();drawFList()};
      r.appendChild(ok);r.appendChild(no);l.appendChild(r);
    });
  }
  var fr=friends(),query=($("fq")&&$("fq").value||"").trim().toLowerCase().replace(/^@/,"");
  var shown=fr.filter(function(id){var p=P[id]||{};return !query||(pn(id)+" "+(p.username||"")).toLowerCase().indexOf(query)>=0});
  var heading=el("div","friends-section-title");heading.appendChild(el("span","","Teman saya"));heading.appendChild(el("span","friends-count",fr.length+" teman"));l.appendChild(heading);
  if(!shown.length){
    var empty=el("div","friend-empty");empty.appendChild(el("div","symbol",query?"⌕":"♧"));
    empty.appendChild(el("b","",query?"Teman tidak ditemukan":(fr.length?"Tidak ada hasil pencarian":"Belum ada teman")));
    empty.appendChild(el("p","",query?"Coba nama atau username yang berbeda.":"Cari pengguna melalui kolom di atas. Setelah permintaan diterima, temanmu akan muncul di daftar ini."));
    l.appendChild(empty);
  }
  shown.forEach(function(id){
    var p=P[id]||{},card=el("div","friend-card");card.appendChild(av(p,48));
    var info=el("div","friend-info");info.appendChild(el("b","",pn(id)));info.appendChild(el("small","","@"+(p.username||"pengguna")));
    card.appendChild(info);
    card.querySelector(".av").classList.add("chat-profile-trigger");card.querySelector(".av").onclick=function(){openPublicProfile(id)};
    info.classList.add("chat-profile-trigger");info.onclick=function(){openPublicProfile(id)};
    var chat=el("button","friend-chat","Chat");chat.onclick=function(){openConv(dm(id),pn(id),av(p,36))};card.appendChild(chat);
    l.appendChild(card);
  });
  var sent=F.filter(function(f){return f.status==="pending"&&f.a===me.id});
  if(sent.length){
    l.appendChild(el("div","friends-section-title","Menunggu persetujuan"));
    sent.forEach(function(f){
      var card=el("div","friend-card");card.appendChild(av(P[f.b],42));
      var info=el("div","friend-info");info.appendChild(el("b","",pn(f.b)));info.appendChild(el("small","","@"+((P[f.b]||{}).username||"")+" · Menunggu"));card.appendChild(info);l.appendChild(card);
    });
  }
}
async function addF(){
  var u=$("fq").value.trim().toLowerCase().replace(/^@/,"");if(!u)return;
  var r=await sb.from("profiles").select("*").eq("username",u).maybeSingle();
  if(!r.data){toast("Username tidak ditemukan");return}
  var t=r.data;if(t.id===me.id){toast("Itu usernamemu sendiri 🙂");return}
  if(F.some(function(f){return f.a===t.id||f.b===t.id})){toast("Sudah ada permintaan atau pertemanan");return}
  P[t.id]=t;var x=await sb.from("friends").insert({a:me.id,b:t.id});
  if(x.error){toast(x.error.message);return}
  $("fq").value="";toast("Permintaan dikirim");await loadF();drawFList();
}

/* ---------- PROFIL ---------- */
function drawMe(){
  var v=$("vme");v.innerHTML="";
  var wrap=el("div","profile-wrap");
  var top=el("div","profile-topline");
  top.appendChild(el("div","profile-handle","@"+(prof.username||"user")));
  var more=el("button","profile-more","···");more.onclick=async function(){if(confirm("Keluar dari akun UChatt? Kamu bisa masuk lagi dengan username dan password yang sama.")){await sb.auth.signOut();location.reload()}};top.appendChild(more);wrap.appendChild(top);

  var stats=el("div","profile-stats");
  var aw=el("div","profile-avatar-wrap");
  var a=av(prof,116);a.onclick=function(){$("pfi").click()};a.style.cursor="pointer";aw.appendChild(a);
  var editAv=el("button","profile-edit-avatar","✎");editAv.onclick=function(){$("pfi").click()};aw.appendChild(editAv);
  stats.appendChild(aw);
  [["0","postingan"],["0","pengikut"],["0","mengikuti"]].forEach(function(x){var st=el("div","stat");st.appendChild(el("strong","",x[0]));st.appendChild(el("span","",x[1]));stats.appendChild(st)});
  wrap.appendChild(stats);

  wrap.appendChild(el("div","profile-name",prof.display_name||prof.username||"Pengguna"));
  var bioText=prof.bio||"nothing special";
  wrap.appendChild(el("div","profile-bio",bioText));

  var actions=el("div","profile-actions");
  var edit=el("button","profile-action","Edit profil");edit.onclick=function(){openProfileEditor()};
  var share=el("button","profile-action","Bagikan profil");share.onclick=async function(){
    var url=location.href.split("#")[0]+"#@"+(prof.username||"");
    try{if(navigator.share)await navigator.share({title:"Profil UChatt",text:"Temukan saya di UChatt @"+prof.username,url:url});else{await navigator.clipboard.writeText(url);toast("Tautan profil disalin")}}catch(e){}
  };
  var add=el("button","profile-action icon","♙");add.onclick=function(){go("friends")};
  actions.appendChild(edit);actions.appendChild(share);actions.appendChild(add);wrap.appendChild(actions);

  var findTitle=el("div","profile-section-title");findTitle.appendChild(el("span","","Temukan orang"));
  var all=el("button","","Lihat semua");all.onclick=function(){go("friends")};findTitle.appendChild(all);wrap.appendChild(findTitle);
  var search=el("div","profile-search","Cari pengguna UChatt melalui Explore.");search.onclick=function(){go("friends")};wrap.appendChild(search);
  v.appendChild(wrap);

  var tabs=el("div","profile-tabs");
  var posts=el("button","profile-tab active","▦  Postingan");
  var statuses=el("button","profile-tab","◉  Status");
  tabs.appendChild(posts);tabs.appendChild(statuses);v.appendChild(tabs);
  var content=el("div","profile-empty");content.id="profilecontent";
  function showPosts(){
    posts.classList.add("active");statuses.classList.remove("active");content.innerHTML="";
    content.appendChild(el("div","profile-empty-icon","▦"));
    content.appendChild(el("strong","","Belum ada postingan"));
    content.appendChild(el("p","","Bagikan foto atau momen pertamamu di UChatt."));
    var b=el("button","btn s","Buat postingan");b.onclick=function(){toast("Fitur postingan akan ditambahkan tanpa mengubah sistem chat")};content.appendChild(b);
  }
  async function showStatuses(){
    statuses.classList.add("active");posts.classList.remove("active");content.innerHTML="";
    var r=await sb.from("statuses").select("*").eq("uid",me.id).order("created_at",{ascending:false});
    if(r.error){content.appendChild(el("p","",r.error.message));return}
    if(!r.data||!r.data.length){content.appendChild(el("div","profile-empty-icon","◉"));content.appendChild(el("strong","","Belum ada status"));content.appendChild(el("p","","Status yang kamu bagikan akan muncul di sini."));return}
    r.data.forEach(function(st){var card=el("div","pad");card.style.cssText="text-align:left;border:1px solid #e7eff5;border-radius:16px;margin:10px 16px;background:#fff";
      card.appendChild(el("b","",new Date(st.created_at).toLocaleDateString("id-ID")));
      if(st.text)card.appendChild(el("p","",st.text));
      else card.appendChild(el("p","","Status "+(st.kind||"media")));
      content.appendChild(card)});
  }
  posts.onclick=showPosts;statuses.onclick=showStatuses;showPosts();
  v.appendChild(content);

  var pf=document.createElement("input");pf.type="file";pf.id="pfi";pf.accept="image/*";pf.hidden=true;
  pf.onchange=async function(){var f=pf.files[0];if(!f)return;if(f.size>8*1048576){toast("Foto maksimal 8 MB");return}
    toast("Mengunggah…");var u=await up(f);if(!u)return;
    var r=await sb.from("profiles").update({avatar_url:u}).eq("id",me.id).select().single();
    if(r.error){toast(r.error.message);return}prof=r.data;P[me.id]=prof;toast("Foto profil diperbarui");drawMe()};
  v.appendChild(pf);
}
function openProfileEditor(){
  var overlay=el("div","profile-modal-backdrop");
  var modal=el("div","profile-modal");
  modal.appendChild(el("h3","","Edit profil"));
  function field(label,value,multiline){
    modal.appendChild(el("label","",label));
    var x=multiline?document.createElement("textarea"):document.createElement("input");
    if(!multiline){x.type="text";x.maxLength=label==="Username"?20:30}
    x.value=value||"";modal.appendChild(x);return x;
  }
  var dn=field("Nama",prof.display_name||"");
  var un=field("Username",prof.username||"");
  var hint=el("small","hint","Username hanya bisa diganti maksimal 2 kali dalam setiap periode 7 hari.");modal.appendChild(hint);
  var bio=field("Bio",prof.bio||"nothing special",true);
  var phone=field("Nomor telepon (opsional)",prof.phone||"");
  phone.placeholder="Contoh: +62 812…";
  var phoneVisibility=document.createElement("label");phoneVisibility.style.cssText="display:flex;align-items:center;gap:9px;margin:10px 0;color:#587487;font-size:13px";
  var phonePublic=document.createElement("input");phonePublic.type="checkbox";phonePublic.checked=prof.phone_visible===true;
  phoneVisibility.appendChild(phonePublic);phoneVisibility.appendChild(document.createTextNode("Tampilkan nomor telepon di profil publik"));
  modal.appendChild(phoneVisibility);
  modal.appendChild(el("small","hint","Nomor telepon tidak ditampilkan kecuali kamu mengaktifkan pilihan di atas."));
  modal.appendChild(el("label","","Ganti password (opsional)"));
  var newPass=document.createElement("input");newPass.type="password";newPass.placeholder="Password baru (minimal 8 karakter)";newPass.autocomplete="new-password";modal.appendChild(newPass);
  var confirmPass=document.createElement("input");confirmPass.type="password";confirmPass.placeholder="Ulangi password baru";confirmPass.autocomplete="new-password";modal.appendChild(confirmPass);
  var actions=el("div","profile-modal-actions");
  var cancel=el("button","profile-action","Batal");cancel.onclick=function(){overlay.remove()};
  var save=el("button","btn","Simpan");save.onclick=async function(){
    var u=un.value.trim().toLowerCase();
    if(!/^[a-z0-9_]{3,20}$/.test(u)){toast("Username 3–20 karakter: huruf kecil, angka, atau _");return}
    if(newPass.value&&(newPass.value.length<8||newPass.value!==confirmPass.value)){toast("Password baru minimal 8 karakter dan konfirmasinya harus sama.");return}
    save.disabled=true;save.textContent="Menyimpan…";
    var current=(prof.username||"").toLowerCase();
    if(u!==current){
      var change=await sb.rpc("uchatt_change_username",{p_new_username:u});
      if(change.error){save.disabled=false;save.textContent="Simpan";toast(change.error.message||"Username gagal diganti");return}
    }
    var r=await sb.from("profiles").update({
      display_name:dn.value.trim()||u,
      phone:phone.value.trim()||null,
      phone_visible:phonePublic.checked
    }).eq("id",me.id).select().single();
    if(r.error){save.disabled=false;save.textContent="Simpan";toast("Username mungkin sudah tersimpan, tetapi nama gagal diperbarui: "+r.error.message);return}
    var meta=await sb.auth.updateUser({data:{bio:bio.value.trim().slice(0,150)}});
    if(meta.error){toast("Profil tersimpan, tetapi bio gagal disimpan: "+meta.error.message)}
    if(newPass.value){var pass=await sb.auth.updateUser({password:newPass.value});if(pass.error){toast("Profil tersimpan, tetapi password gagal diganti: "+pass.error.message)}else{toast("Password berhasil diganti")}}
    prof=r.data;prof.username=u;prof.bio=bio.value.trim().slice(0,150);P[me.id]=prof;
    overlay.remove();toast("Profil diperbarui");drawMe();
  };
  actions.appendChild(cancel);actions.appendChild(save);modal.appendChild(actions);overlay.appendChild(modal);$("app").appendChild(overlay);
}
}
function launch(){try{startApp()}catch(e){showErr("Gagal memulai: "+e.message)}}
if(window.supabase)launch();else{var sc=document.createElement("script");sc.src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";sc.onload=launch;sc.onerror=function(){showErr("Pustaka Supabase gagal dimuat. Cek internet atau matikan adblock, lalu muat ulang.")};document.head.appendChild(sc)}
